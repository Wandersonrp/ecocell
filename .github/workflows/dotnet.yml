
name: .NET

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore Ecocell.slnx

    - name: Build
      run: dotnet build Ecocell.slnx --no-restore

    - name: Test
      run: dotnet test Ecocell.slnx --no-build --verbosity normal --collect:"XPlat Code Coverage"

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: "**/coverage.cobertura.xml"
        if-no-files-found: ignore