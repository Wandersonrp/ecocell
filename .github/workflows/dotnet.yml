name: .NET + SonarCloud

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Install SonarScanner
      run: dotnet tool install --global dotnet-sonarscanner

    - name: Restore dependencies
      run: dotnet restore Ecocell.Backend.slnf

    - name: Begin SonarCloud analysis
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        dotnet sonarscanner begin \
          /k:"Wandersonrp_ecocell" \
          /o:"wandersonrp" \
          /d:sonar.host.url="https://sonarcloud.io" \
          /d:sonar.cs.opencover.reportsPaths="coverage/**/coverage.opencover.xml" \
          /d:sonar.exclusions="**/appsettings.Example.json,**/appsettings.Testing.json,**/Migrations/**" \
          /d:sonar.coverage.exclusions="**/appsettings.Example.json,**/appsettings.Testing.json,**/Migrations/**"

    - name: Build
      run: dotnet build Ecocell.Backend.slnf --no-restore

    - name: Test with coverage
      env:
        ConnectionStrings__DefaultConnection: "Host=placeholder"
        Redis__ConnectionString: "localhost:6379"
        Jwt__SigningKey: ${{ secrets.JWT_SIGNING_KEY_TEST }}
        Jwt__Issuer: "ecocell-test"
        Jwt__Audience: "ecocell-test"
        Jwt__AccessTokenLifetimeMinutes: "60"
        Jwt__RefreshTokenLifetimeDays: "7"
        Nominatim__BaseUrl: "http://localhost/"
        Nominatim__UserAgent: "ecocell-integration-test"
        Nominatim__TimeoutSeconds: "5"
      run: dotnet test Ecocell.Backend.slnf --no-build --settings coverlet.runsettings --results-directory coverage

    - name: End SonarCloud analysis
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: dotnet sonarscanner end
